# Kizuna Meridian Burden：把有效负重换算为 Human 行走与疾跑的负荷倍率（逻辑服务器读取）。
# 只允许下面两个键，拼错或多出的键会让服务器拒绝启动。修改后重启服务器或重新进入单机世界生效。

# 倍率 = 1 + 有效负重 kg / reference_kg；有效负重由 BS3D Weights 的 config/bs3d_weights/burden.toml 按来源系数算出。
# 默认 70 kg 有效负重走路正好耗双倍体力。必须是正的有限数，可写整数或小数。必须写，缺了服务器拒绝启动。
reference_kg = 70

# Weights 算不出负重时的行走负荷倍率：随身容器或物品太多、套得太深、物品数据异常时 Weights 不给读数，
# 这时按这个倍率结算，不按无负荷，也不沿用上一次读数，免得故意凑出超限来甩掉负重。
# 默认 4.2 是占位值，等试玩再定。Human 的做功受各块肌肉的爆发功率封顶：疾跑用到的肌肉在约 4.2 倍时全部顶到上限，
# 再重的合法负重疾跑起来也一样累，即疾跑的最重一档；行走要到约 16.7 倍才封顶，4.2 倍时走路约 71 秒耗尽耐力。
# 必须是不小于 1 的有限数，写 1 等于算不出时不计负重。旧文件没有这个键时按默认值运行，启动日志会提示。
unavailable_multiplier = 4.2
