plugins { id 'net.fabricmc.fabric-loom' }

description = '按 BS3D Weights 的有效负重放大 Human 行走与疾跑做功。'

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    // 26.x 不混淆：直接用官方名编译，没有映射，模组依赖也不经重映射。
    minecraft libs.minecraft
    implementation libs.fabric.loader
    implementation libs.fabric.api

    // 相邻仓库在 settings 中以源码组合，与原先读单个 JAR 一致只取各模块本身。
    // 行走负荷接入点来自必装 Human；开发运行由完整装配按同一组件装入。
    compileOnly('dev.kizuna.meridian.human:fabric') { transitive = false }
    // 有效负重 API 来自必装 Weights 的服务端模块。
    implementation('dev.kizuna.bs3d.weights:server') { transitive = false }
    // 参考负重写在 TOML，安装 JAR 自带解析库；版本目录条目是 Provider，嵌套声明单独写。
    implementation libs.tomlj
    include libs.tomlj
    implementation libs.antlr.runtime
    include libs.antlr.runtime
    testImplementation libs.junit4
}

test { useJUnit() }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

// 开发运行沿用 Meridian 统一完整装配；Human 的嵌套 Framework、协议库与客户端产物在开发时显式补齐。
// Human 客户端库只在开发运行时需要，按装配清单读已构建的 JAR。
apply from: new File(kizunaWorkspace.directory('framework'), 'scripts/full-assembly.gradle')
dependencies {
    localRuntime('local.meridian:server') { transitive = false }
    localRuntime files(kizunaWorkspace.artifact('human', 'client', false))
    localRuntime libs.protobuf.java
}

loom {
    mods {
        meridian_burden { sourceSet sourceSets.main }
    }
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    // GameTest 经 Human 公开健康宿主读取 Framework 身体快照。
    gametestCompileOnly('local.meridian:server') { transitive = false }
    gametestCompileOnly libs.protobuf.java
    // 登录假玩家夹具来自功法库的 testFixtures，与功法 fabric 同经源码组合解析。
    gametestImplementation testFixtures('dev.kizuna.meridian.technique:fabric')
}

loom {
    mods {
        meridian_burden_test { sourceSet sourceSets.gametest }
    }
    runs {
        gametest {
            server()
            name '负重 GameTest'
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
        }
    }
}

afterEvaluate {
    tasks.named('runGametest') {
        doFirst {
            // 平坦世界、固定本机地址与最小视距，避免占用用户环境。
            def runDirectory = file('build/gametest')
            runDirectory.mkdirs()
            new File(runDirectory, 'eula.txt').text = 'eula=true\n'
            new File(runDirectory, 'server.properties').text = '''online-mode=false
server-ip=127.0.0.1
server-port=0
level-type=flat
generate-structures=false
view-distance=2
simulation-distance=2
'''
        }
    }
}
